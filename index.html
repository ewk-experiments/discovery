<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Portrait orientation overlay -->
  <div class="portrait-overlay">
    <div class="rotate-prompt">
      <svg class="rotate-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="25" y="10" width="30" height="55" rx="4" stroke="currentColor" stroke-width="1.5"/>
        <rect x="35" y="45" width="55" height="30" rx="4" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 3"/>
        <path d="M68 30 C 80 30, 85 35, 85 45" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <polygon points="83,44 87,44 85,48" fill="currentColor"/>
      </svg>
      <span>Rotate to landscape</span>
    </div>
  </div>

  <!-- Mobile coming soon -->
  <div class="mobile-notice">
    <span class="logo-small">discovery</span>
    <span>desktop experience only</span>
    <span>mobile coming soon</span>
  </div>

  <div class="workspace-layout">

    <!-- Header -->
    <header class="workspace-header">
      <div class="header-left">
        <span class="workspace-logo">discovery</span>
        <span class="header-divider"></span>
        <span class="project-name">Untitled Session</span>
      </div>
      <div class="header-center">
        <span class="project-meta mono">T: 128.0</span>
        <span class="meta-dot"></span>
        <span class="project-meta mono">K: F min</span>
        <span class="meta-dot"></span>
        <span class="project-meta mono">4:32</span>
      </div>
      <div class="header-right">
        <button class="header-btn">Undo</button>
        <button class="header-btn">Redo</button>
        <button class="header-btn primary">Export</button>
      </div>
    </header>

    <!-- Source Rack -->
    <aside class="source-rack">
      <div class="panel-header">
        <span class="panel-title">Source Rack</span>
        <button class="panel-action">+ Add</button>
      </div>
      <div class="source-list" id="sourceList"></div>
      <div class="upload-zone" id="uploadZone">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16"/></svg>
        <span>Drop audio files</span>
      </div>
    </aside>

    <!-- Timeline -->
    <main class="timeline-area">
      <div class="timeline-toolbar">
        <div class="tool-group">
          <button class="tool-btn active" title="Select">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
          </button>
          <button class="tool-btn" title="Slice">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/></svg>
          </button>
          <button class="tool-btn" title="Draw">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="tool-group">
          <button class="tool-btn text-btn active mono">SNAP</button>
          <button class="tool-btn text-btn mono">1/16</button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="tool-group">
          <button class="tool-btn" title="Zoom in">+</button>
          <button class="tool-btn" title="Zoom out">−</button>
        </div>
        <div style="flex:1"></div>
        <button class="regen-btn mono">Regenerate</button>
      </div>

      <div class="timeline-ruler">
        <div class="ruler-marks" id="rulerMarks"></div>
      </div>

      <div class="timeline-tracks" id="timelineTracks">
        <div class="playhead" id="playhead"></div>
      </div>
    </main>

    <!-- Right Panel -->
    <aside class="right-panel">
      <div class="panel-header">
        <span class="panel-title">Fragments</span>
        <span class="frag-count" id="fragCount">24</span>
      </div>
      <div class="fragment-tabs">
        <button class="fragment-tab active" data-cat="all">All</button>
        <button class="fragment-tab" data-cat="vocal">Vox</button>
        <button class="fragment-tab" data-cat="chord">Chrd</button>
        <button class="fragment-tab" data-cat="texture">Tex</button>
        <button class="fragment-tab" data-cat="perc">Perc</button>
        <button class="fragment-tab" data-cat="oneshot">Hit</button>
      </div>
      <div class="fragment-browser">
        <div class="fragment-list" id="fragmentList"></div>
      </div>

      <div class="vibe-mixer">
        <div class="panel-header">
          <span class="panel-title">Vibe Mixer</span>
        </div>
        <div class="vibe-controls" id="vibeControls">
          <div class="vibe-control" data-param="choppiness" data-min="0" data-max="100" data-value="72">
            <div class="knob-container">
              <svg viewBox="0 0 44 44" width="44" height="44">
                <circle class="knob-ring" cx="22" cy="22" r="18"/>
                <circle class="knob-track" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="31.7" transform="rotate(-135 22 22)"/>
                <circle class="knob-dot" cx="22" cy="6" r="2.5"/>
              </svg>
            </div>
            <span class="vibe-value mono">72%</span>
            <span class="vibe-label">Chop</span>
          </div>
          <div class="vibe-control" data-param="density" data-min="0" data-max="100" data-value="58">
            <div class="knob-container">
              <svg viewBox="0 0 44 44" width="44" height="44">
                <circle class="knob-ring" cx="22" cy="22" r="18"/>
                <circle class="knob-track" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="47.5" transform="rotate(-135 22 22)"/>
                <circle class="knob-dot" cx="22" cy="6" r="2.5"/>
              </svg>
            </div>
            <span class="vibe-value mono">58%</span>
            <span class="vibe-label">Density</span>
          </div>
          <div class="vibe-control" data-param="harmonic" data-min="0" data-max="100" data-value="40">
            <div class="knob-container">
              <svg viewBox="0 0 44 44" width="44" height="44">
                <circle class="knob-ring" cx="22" cy="22" r="18"/>
                <circle class="knob-track" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="67.9" transform="rotate(-135 22 22)"/>
                <circle class="knob-dot" cx="22" cy="6" r="2.5"/>
              </svg>
            </div>
            <span class="vibe-value mono">40%</span>
            <span class="vibe-label">Harmonic</span>
          </div>
          <div class="vibe-control" data-param="tempo" data-min="60" data-max="180" data-value="128">
            <div class="knob-container">
              <svg viewBox="0 0 44 44" width="44" height="44">
                <circle class="knob-ring" cx="22" cy="22" r="18"/>
                <circle class="knob-track" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="31.7" transform="rotate(-135 22 22)"/>
                <circle class="knob-dot" cx="22" cy="6" r="2.5"/>
              </svg>
            </div>
            <span class="vibe-value mono">128</span>
            <span class="vibe-label">Tempo</span>
          </div>
          <div class="vibe-control" data-param="groove" data-min="0" data-max="100" data-value="85">
            <div class="knob-container">
              <svg viewBox="0 0 44 44" width="44" height="44">
                <circle class="knob-ring" cx="22" cy="22" r="18"/>
                <circle class="knob-track" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="17" transform="rotate(-135 22 22)"/>
                <circle class="knob-dot" cx="22" cy="6" r="2.5"/>
              </svg>
            </div>
            <span class="vibe-value mono">85%</span>
            <span class="vibe-label">Groove</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Transport -->
    <div class="transport-bar">
      <div class="transport-meter">
        <span class="meter-label mono">L</span>
        <div class="meter-bar"><div class="meter-fill" id="meterL" style="width:65%"></div></div>
      </div>
      <div class="transport-controls">
        <button class="transport-btn" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="transport-btn" title="Stop" id="stopBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="0"/></svg>
        </button>
        <button class="transport-btn play-btn" title="Play" id="playBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>
        </button>
        <button class="transport-btn" title="Record" id="recBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="6"/></svg>
        </button>
        <button class="transport-btn" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>
      <div class="transport-time mono" id="transportTime">00:00.000</div>
      <div class="transport-bpm mono">BPM <span id="bpmDisplay">128</span></div>
      <div class="transport-meter">
        <span class="meter-label mono">R</span>
        <div class="meter-bar"><div class="meter-fill" id="meterR" style="width:58%"></div></div>
      </div>
    </div>

  </div>

  <script>
    // --- Data ---
    const sources = [
      { name: 'Todd Edwards — Saved My Life', bpm: 126, key: 'Eb maj', duration: '4:18', fragments: 8 },
      { name: 'Romanthony — Hold On', bpm: 122, key: 'F min', duration: '5:02', fragments: 6 },
      { name: 'Barry Manilow — Who Needs to Dream', bpm: 118, key: 'Ab maj', duration: '3:45', fragments: 5 },
      { name: 'Sister Sledge — Il Macquillage Lady', bpm: 128, key: 'Bb min', duration: '6:11', fragments: 5 },
    ];

    const fragments = [
      { name: 'vox_savedmylife_01', cat: 'vocal', dur: '0.8s', key: 'Eb', src: 0 },
      { name: 'vox_savedmylife_02', cat: 'vocal', dur: '1.2s', key: 'Eb', src: 0 },
      { name: 'vox_holdon_01', cat: 'vocal', dur: '0.6s', key: 'F', src: 1 },
      { name: 'vox_holdon_02', cat: 'vocal', dur: '1.4s', key: 'F', src: 1 },
      { name: 'chord_manilow_01', cat: 'chord', dur: '2.0s', key: 'Ab', src: 2 },
      { name: 'chord_manilow_02', cat: 'chord', dur: '1.6s', key: 'Ab', src: 2 },
      { name: 'chord_sledge_01', cat: 'chord', dur: '1.8s', key: 'Bb', src: 3 },
      { name: 'tex_savedmylife_01', cat: 'texture', dur: '3.2s', key: '-', src: 0 },
      { name: 'tex_holdon_01', cat: 'texture', dur: '2.4s', key: '-', src: 1 },
      { name: 'tex_sledge_01', cat: 'texture', dur: '4.0s', key: '-', src: 3 },
      { name: 'perc_savedmylife_01', cat: 'perc', dur: '0.3s', key: '-', src: 0 },
      { name: 'perc_holdon_01', cat: 'perc', dur: '0.2s', key: '-', src: 1 },
      { name: 'perc_holdon_02', cat: 'perc', dur: '0.4s', key: '-', src: 1 },
      { name: 'perc_manilow_01', cat: 'perc', dur: '0.2s', key: '-', src: 2 },
      { name: 'perc_sledge_01', cat: 'perc', dur: '0.3s', key: '-', src: 3 },
      { name: 'perc_sledge_02', cat: 'perc', dur: '0.5s', key: '-', src: 3 },
      { name: 'hit_savedmylife_01', cat: 'oneshot', dur: '0.1s', key: 'Eb', src: 0 },
      { name: 'hit_holdon_01', cat: 'oneshot', dur: '0.15s', key: 'F', src: 1 },
      { name: 'vox_manilow_01', cat: 'vocal', dur: '0.9s', key: 'Ab', src: 2 },
      { name: 'chord_savedmylife_01', cat: 'chord', dur: '2.2s', key: 'Eb', src: 0 },
      { name: 'tex_manilow_01', cat: 'texture', dur: '2.8s', key: '-', src: 2 },
      { name: 'hit_manilow_01', cat: 'oneshot', dur: '0.12s', key: 'Ab', src: 2 },
      { name: 'hit_sledge_01', cat: 'oneshot', dur: '0.08s', key: 'Bb', src: 3 },
      { name: 'vox_sledge_01', cat: 'vocal', dur: '1.1s', key: 'Bb', src: 3 },
    ];

    const tracks = [
      { label: 'VOX', blocks: [
        { type: 'vocal', name: 'vox_savedmylife_01', left: 80, width: 90 },
        { type: 'vocal', name: 'vox_holdon_01', left: 200, width: 60 },
        { type: 'vocal', name: 'vox_savedmylife_02', left: 340, width: 120 },
        { type: 'vocal', name: 'vox_holdon_02', left: 520, width: 140 },
        { type: 'vocal', name: 'vox_manilow_01', left: 720, width: 95 },
      ]},
      { label: 'CHRD', blocks: [
        { type: 'chord', name: 'chord_manilow_01', left: 60, width: 180 },
        { type: 'chord', name: 'chord_sledge_01', left: 260, width: 160 },
        { type: 'chord', name: 'chord_savedmylife_01', left: 460, width: 200 },
        { type: 'chord', name: 'chord_manilow_02', left: 700, width: 150 },
      ]},
      { label: 'TEX', blocks: [
        { type: 'texture', name: 'tex_savedmylife_01', left: 60, width: 280 },
        { type: 'texture', name: 'tex_holdon_01', left: 380, width: 220 },
        { type: 'texture', name: 'tex_sledge_01', left: 640, width: 300 },
      ]},
      { label: 'PERC', blocks: [
        { type: 'perc', name: 'perc_holdon_01', left: 80, width: 30 },
        { type: 'perc', name: 'perc_sledge_01', left: 140, width: 35 },
        { type: 'perc', name: 'perc_holdon_02', left: 200, width: 40 },
        { type: 'perc', name: 'perc_manilow_01', left: 260, width: 25 },
        { type: 'perc', name: 'perc_savedmylife_01', left: 320, width: 30 },
        { type: 'perc', name: 'perc_sledge_02', left: 380, width: 45 },
        { type: 'perc', name: 'perc_holdon_01', left: 440, width: 30 },
        { type: 'perc', name: 'perc_sledge_01', left: 500, width: 35 },
        { type: 'perc', name: 'perc_holdon_02', left: 560, width: 40 },
        { type: 'perc', name: 'perc_manilow_01', left: 630, width: 25 },
        { type: 'perc', name: 'perc_savedmylife_01', left: 700, width: 30 },
        { type: 'perc', name: 'perc_sledge_02', left: 770, width: 45 },
      ]},
      { label: 'HITS', blocks: [
        { type: 'oneshot', name: 'hit_savedmylife_01', left: 140, width: 20 },
        { type: 'oneshot', name: 'hit_holdon_01', left: 320, width: 22 },
        { type: 'oneshot', name: 'hit_manilow_01', left: 500, width: 18 },
        { type: 'oneshot', name: 'hit_sledge_01', left: 700, width: 15 },
      ]},
    ];

    // Line styles per type (monochromatic)
    const lineStyles = {
      vocal:   { weight: 2,   dash: [], opacity: 0.85 },
      chord:   { weight: 1.5, dash: [4, 3], opacity: 0.65 },
      texture: { weight: 1,   dash: [], opacity: 0.45 },
      perc:    { weight: 2,   dash: [2, 2], opacity: 0.75 },
      oneshot: { weight: 2.5, dash: [], opacity: 0.9 }
    };

    // --- Render sources ---
    const sourceList = document.getElementById('sourceList');
    sources.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'source-card' + (i === 0 ? ' active' : '');
      card.setAttribute('data-fig', 'FIG. 0' + (i + 1));
      card.innerHTML = `
        <div class="source-name">${s.name}</div>
        <div class="source-meta"><span>${s.bpm} BPM</span><span>${s.key}</span><span>${s.duration}</span></div>
        <div class="source-waveform"><canvas data-src="${i}"></canvas></div>
        <div class="source-badge mono">${s.fragments} fragments extracted</div>
      `;
      sourceList.appendChild(card);
    });

    // --- Render fragments ---
    const fragmentList = document.getElementById('fragmentList');
    function renderFragments(cat) {
      fragmentList.innerHTML = '';
      const filtered = cat === 'all' ? fragments : fragments.filter(f => f.cat === cat);
      document.getElementById('fragCount').textContent = filtered.length;
      filtered.forEach((f, idx) => {
        const item = document.createElement('div');
        item.className = 'fragment-item';
        item.draggable = true;
        item.innerHTML = `
          <div class="frag-color"></div>
          <div class="frag-wave"><canvas data-frag="${f.name}"></canvas></div>
          <div class="frag-info">
            <div class="frag-name mono">${f.name}</div>
            <div class="frag-meta">${f.dur} / ${f.key}</div>
          </div>
          <button class="frag-play">&#9654;</button>
        `;
        fragmentList.appendChild(item);
      });
      drawMiniWaveforms();
    }
    renderFragments('all');

    document.querySelectorAll('.fragment-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.fragment-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderFragments(tab.dataset.cat);
      });
    });

    // --- Render ruler ---
    const rulerMarks = document.getElementById('rulerMarks');
    for (let i = 1; i <= 16; i++) {
      const mark = document.createElement('div');
      mark.className = 'ruler-mark';
      mark.innerHTML = `<span>${i}</span>`;
      rulerMarks.appendChild(mark);
    }

    // --- Render tracks ---
    const timelineTracks = document.getElementById('timelineTracks');
    const trackLabels = ['A', 'B', 'C', 'D', 'E'];
    tracks.forEach((t, ti) => {
      const track = document.createElement('div');
      track.className = 'track';
      track.innerHTML = `
        <div class="track-header">
          <span class="track-label mono">${t.label}</span>
          <div class="track-controls">
            <button class="track-btn mute" title="Mute">M</button>
            <button class="track-btn solo" title="Solo">S</button>
          </div>
        </div>
        <div class="track-content">
          ${t.blocks.map((b, bi) => `
            <div class="sample-block ${b.type}" style="left:${b.left}px;width:${b.width}px" draggable="true" title="${b.name}">
              <canvas class="block-waveform"></canvas>
              <span class="block-label mono">${trackLabels[ti]}.${bi + 1}</span>
            </div>
          `).join('')}
        </div>
      `;
      timelineTracks.appendChild(track);
    });

    // --- Waveform drawing (oscilloscope / wireframe style) ---
    function drawWireframeWave(canvas, seed, style) {
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0) return;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      const w = rect.width, h = rect.height, mid = h / 2;

      ctx.strokeStyle = `rgba(30, 30, 30, ${style.opacity})`;
      ctx.lineWidth = style.weight;
      ctx.setLineDash(style.dash);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();

      const points = Math.max(Math.floor(w / 3), 12);
      for (let i = 0; i <= points; i++) {
        const x = (i / points) * w;
        const s = seed + i * 0.2;
        const amp = Math.sin(s * 0.8) * 0.3 + Math.sin(s * 1.6) * 0.12;
        const y = mid + amp * h * 0.6;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawMiniWaveforms() {
      document.querySelectorAll('.source-waveform canvas').forEach((c, i) => {
        drawWireframeWave(c, i * 47, { weight: 1.5, dash: [], opacity: 0.5 });
      });
      document.querySelectorAll('.frag-wave canvas').forEach((c, i) => {
        drawWireframeWave(c, i * 31, { weight: 1.2, dash: [], opacity: 0.4 });
      });
    }

    function drawBlockWaveforms() {
      document.querySelectorAll('.sample-block').forEach((block, i) => {
        const c = block.querySelector('.block-waveform');
        const type = block.classList[1];
        const style = lineStyles[type] || { weight: 1, dash: [], opacity: 0.5 };
        drawWireframeWave(c, i * 23, style);
      });
    }

    setTimeout(() => { drawMiniWaveforms(); drawBlockWaveforms(); }, 120);
    window.addEventListener('resize', () => { drawMiniWaveforms(); drawBlockWaveforms(); });

    // --- Knob controls ---
    const ARC_TOTAL = 270; // degrees of travel
    const CIRCUMFERENCE = 2 * Math.PI * 18; // r=18

    function updateKnob(control, value) {
      const min = parseFloat(control.dataset.min);
      const max = parseFloat(control.dataset.max);
      const pct = (value - min) / (max - min);
      control.dataset.value = value;

      // Update arc
      const arcLength = pct * (ARC_TOTAL / 360) * CIRCUMFERENCE;
      const offset = CIRCUMFERENCE - arcLength;
      const track = control.querySelector('.knob-track');
      track.setAttribute('stroke-dashoffset', offset);

      // Update dot position (rotate around center)
      const angle = -135 + pct * ARC_TOTAL;
      const rad = angle * Math.PI / 180;
      const dot = control.querySelector('.knob-dot');
      const cx = 22 + 18 * Math.sin(rad);
      const cy = 22 - 18 * Math.cos(rad);
      dot.setAttribute('cx', cx);
      dot.setAttribute('cy', cy);

      // Update value display
      const display = control.querySelector('.vibe-value');
      if (control.dataset.param === 'tempo') {
        display.textContent = Math.round(value);
        document.getElementById('bpmDisplay').textContent = Math.round(value);
      } else {
        display.textContent = Math.round(value) + '%';
      }
    }

    // Init knobs
    document.querySelectorAll('.vibe-control[data-param]').forEach(control => {
      updateKnob(control, parseFloat(control.dataset.value));
    });

    // Drag interaction for knobs
    let activeKnob = null;
    let knobStartY = 0;
    let knobStartValue = 0;

    document.addEventListener('mousedown', e => {
      const knobContainer = e.target.closest('.knob-container');
      if (!knobContainer) return;
      const control = knobContainer.closest('.vibe-control');
      if (!control) return;
      activeKnob = control;
      knobStartY = e.clientY;
      knobStartValue = parseFloat(control.dataset.value);
      e.preventDefault();
    });

    document.addEventListener('mousemove', e => {
      if (!activeKnob) return;
      const min = parseFloat(activeKnob.dataset.min);
      const max = parseFloat(activeKnob.dataset.max);
      const range = max - min;
      const delta = (knobStartY - e.clientY) * (range / 150); // 150px drag = full range
      const newValue = Math.max(min, Math.min(max, knobStartValue + delta));
      updateKnob(activeKnob, newValue);
    });

    document.addEventListener('mouseup', () => {
      activeKnob = null;
    });

    // --- Transport ---
    let playing = false;
    let playheadPos = 60;
    let animFrame = null;
    const playhead = document.getElementById('playhead');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const transportTime = document.getElementById('transportTime');

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      const milli = Math.floor(ms % 1000);
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(milli).padStart(3,'0')}`;
    }

    let startTime = 0;
    function animate(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      playheadPos = 60 + (elapsed * 0.08);
      if (playheadPos > 960) { playheadPos = 60; startTime = ts; }
      playhead.style.left = playheadPos + 'px';
      transportTime.textContent = formatTime(elapsed);
      const mL = document.getElementById('meterL');
      const mR = document.getElementById('meterR');
      if (mL && mR) {
        mL.style.width = (40 + Math.sin(elapsed * 0.005) * 25 + Math.sin(elapsed * 0.013) * 10) + '%';
        mR.style.width = (38 + Math.sin(elapsed * 0.006 + 1) * 22 + Math.sin(elapsed * 0.011) * 12) + '%';
      }
      if (playing) animFrame = requestAnimationFrame(animate);
    }

    playBtn.addEventListener('click', () => {
      playing = !playing;
      if (playing) {
        startTime = 0;
        animFrame = requestAnimationFrame(animate);
        playBtn.classList.add('playing');
        playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="0"/><rect x="14" y="5" width="4" height="14" rx="0"/></svg>';
      } else {
        cancelAnimationFrame(animFrame);
        playBtn.classList.remove('playing');
        playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>';
      }
    });

    stopBtn.addEventListener('click', () => {
      playing = false;
      cancelAnimationFrame(animFrame);
      playheadPos = 60;
      playhead.style.left = '60px';
      transportTime.textContent = '00:00.000';
      startTime = 0;
      playBtn.classList.remove('playing');
      playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>';
    });

    // --- Interactive toggles ---
    document.addEventListener('click', e => {
      if (e.target.classList.contains('track-btn')) {
        e.target.classList.toggle('active');
        const track = e.target.closest('.track');
        if (track) {
          // Handle mute
          if (e.target.classList.contains('mute')) {
            track.classList.toggle('muted', e.target.classList.contains('active'));
          }
          // Handle solo
          if (e.target.classList.contains('solo')) {
            track.classList.toggle('soloed', e.target.classList.contains('active'));
            // If any track is soloed, dim all non-soloed tracks
            const allTracks = document.querySelectorAll('.track');
            const anySoloed = document.querySelector('.track.soloed');
            allTracks.forEach(t => {
              if (anySoloed) {
                if (!t.classList.contains('soloed') && !t.classList.contains('muted')) {
                  t.style.opacity = '0.25';
                } else if (t.classList.contains('soloed')) {
                  t.style.opacity = '';
                }
              } else {
                if (!t.classList.contains('muted')) {
                  t.style.opacity = '';
                }
              }
            });
          }
        }
      }
      const card = e.target.closest('.source-card');
      if (card) {
        document.querySelectorAll('.source-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      }
      const toolBtn = e.target.closest('.tool-btn:not(.text-btn)');
      if (toolBtn && toolBtn.closest('.tool-group')) {
        toolBtn.closest('.tool-group').querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        toolBtn.classList.add('active');
      }
    });

    // --- Drag sample blocks ---
    let dragBlock = null, dragOffsetX = 0;
    document.addEventListener('mousedown', e => {
      const block = e.target.closest('.sample-block');
      if (!block) return;
      dragBlock = block;
      dragOffsetX = e.clientX - block.getBoundingClientRect().left;
      block.classList.add('dragging');
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragBlock) return;
      const parent = dragBlock.parentElement.getBoundingClientRect();
      let newLeft = e.clientX - parent.left - dragOffsetX;
      newLeft = Math.max(0, newLeft);
      dragBlock.style.left = newLeft + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (dragBlock) {
        dragBlock.classList.remove('dragging');
        dragBlock = null;
      }
    });
  </script>

</body>
</html>
