<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery — Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="landing-nav" id="nav">
    <a href="index.html" class="logo">ewk<span>labs</span> / discovery</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="workspace.html">Workspace</a>
      <a href="library.html" style="color:var(--text-primary)">Library</a>
    </div>
  </nav>

  <div class="library-layout">

    <div class="library-header" style="padding-top:7rem">
      <h1>Library</h1>
      <p>Browse, download, and share your compositions.</p>
    </div>

    <div class="library-toolbar">
      <div class="library-filters">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Recent</button>
        <button class="filter-btn">Favorites</button>
        <button class="filter-btn">Shared</button>
      </div>
      <div class="library-sort">
        <span style="font-size:0.75rem;color:var(--text-tertiary)">Sort by</span>
        <select>
          <option>Date created</option>
          <option>Name</option>
          <option>Duration</option>
          <option>Sources used</option>
        </select>
      </div>
    </div>

    <div class="library-grid" id="libraryGrid"></div>

    <footer class="landing-footer" style="max-width:1200px;margin:0 auto">
      <span class="copyright mono">2026 EWKLABS</span>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="workspace.html">Workspace</a>
      </div>
    </footer>

  </div>

  <script>
    const compositions = [
      { name: 'Face Forward', bpm: 128, key: 'F min', duration: '3:42', sources: 4, tags: ['vocal-heavy', 'groovy', 'house'], date: '2026-03-28' },
      { name: 'Phantom Thread', bpm: 122, key: 'Ab maj', duration: '4:15', sources: 3, tags: ['textural', 'ambient', 'slow-burn'], date: '2026-03-27' },
      { name: 'Sledgehammer Funk', bpm: 130, key: 'Bb min', duration: '2:58', sources: 5, tags: ['percussive', 'chopped', 'funk'], date: '2026-03-26' },
      { name: 'Digital Nostalgia', bpm: 118, key: 'Eb maj', duration: '5:01', sources: 6, tags: ['melodic', 'warm', 'disco'], date: '2026-03-25' },
      { name: 'Micro Cuts', bpm: 140, key: 'C min', duration: '3:12', sources: 4, tags: ['glitchy', 'fast', 'experimental'], date: '2026-03-24' },
      { name: 'Soft Machine', bpm: 110, key: 'D maj', duration: '4:48', sources: 3, tags: ['downtempo', 'lush', 'layered'], date: '2026-03-23' },
      { name: 'Todd\'s Ghost', bpm: 126, key: 'F min', duration: '3:33', sources: 4, tags: ['vocal-chop', 'garage', 'UK'], date: '2026-03-22' },
      { name: 'Sample & Hold', bpm: 132, key: 'G min', duration: '4:05', sources: 5, tags: ['electro', 'minimal', 'precise'], date: '2026-03-21' },
      { name: 'Recombinant', bpm: 124, key: 'A min', duration: '3:50', sources: 7, tags: ['dense', 'complex', 'rich'], date: '2026-03-20' },
    ];

    const grid = document.getElementById('libraryGrid');

    compositions.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'comp-card';
      card.innerHTML = `
        <div class="comp-waveform">
          <canvas data-comp="${i}"></canvas>
          <div class="comp-play-overlay">
            <div class="play-circle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>
            </div>
          </div>
        </div>
        <div class="comp-info">
          <div class="comp-name">${c.name}</div>
          <div class="comp-meta">
            <span>${c.bpm} BPM</span>
            <span>${c.key}</span>
            <span>${c.duration}</span>
            <span>${c.sources} sources</span>
          </div>
          <div class="comp-tags">
            ${c.tags.map(t => `<span class="comp-tag">${t}</span>`).join('')}
          </div>
          <div class="comp-actions">
            <button class="download">Download</button>
            <button>Stems</button>
            <button>Share</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    // Draw waveforms
    function drawCompWaveform(canvas, seed) {
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0) return;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      const w = rect.width, h = rect.height, mid = h / 2;
      const bars = Math.floor(w / 3);
      ctx.fillStyle = 'rgba(232, 56, 13, 0.2)';
      for (let i = 0; i < bars; i++) {
        const s = seed + i;
        const amp = Math.sin(s*0.08)*0.35 + Math.sin(s*0.19)*0.25 + Math.sin(s*0.47)*0.15 + (Math.sin(s*1.1)*0.5+0.5)*0.1;
        const barH = Math.abs(amp) * h * 0.85 + 2;
        ctx.fillRect(i * 3, mid - barH / 2, 2, barH);
      }
      ctx.fillStyle = 'rgba(232, 56, 13, 0.45)';
      for (let i = 0; i < bars; i += 5) {
        const s = seed + i;
        const barH = (Math.sin(s*0.2)*0.5+0.5) * h * 0.5 + 3;
        ctx.fillRect(i * 3, mid - barH / 2, 2, barH);
      }
    }

    function drawAll() {
      document.querySelectorAll('.comp-waveform canvas').forEach((c, i) => {
        drawCompWaveform(c, i * 53 + 7);
      });
    }
    setTimeout(drawAll, 50);
    window.addEventListener('resize', drawAll);

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Nav scroll
    window.addEventListener('scroll', () => {
      document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 50);
    });
  </script>

</body>
</html>
